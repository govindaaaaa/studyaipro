services:
  # RAG Service (Python)
  - type: web
    name: studyai-rag-service
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: FAISS_DIR
        value: /tmp/faiss
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: PORT
        value: 8001

  # Backend API (Node.js)
  - type: web
    name: studyai-backend
    runtime: node
    rootDir: backend-node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
