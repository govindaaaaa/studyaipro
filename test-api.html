<!DOCTYPE html>
<html>
<head>
    <title>Test API</title>
</head>
<body>
    <h1>API Test</h1>
    <div id="output"></div>
    <script>
        const output = document.getElementById('output');
        
        // Get token from localStorage
        const token = localStorage.getItem('token');
        
        output.innerHTML = '<p>Token: ' + (token ? token.substring(0, 20) + '...' : 'NO TOKEN FOUND') + '</p>';
        
        if (!token) {
            output.innerHTML += '<p style="color: red;">❌ You need to login first!</p>';
            output.innerHTML += '<p>Go to <a href="http://localhost:3002/login">Login Page</a></p>';
        } else {
            // Test API call
            fetch('http://localhost:8000/upload/sessions', {
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            })
            .then(r => r.json())
            .then(data => {
                output.innerHTML += '<h2>✅ API Response:</h2>';
                output.innerHTML += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                
                if (data.sessions && data.sessions.length > 0) {
                    output.innerHTML += '<p style="color: green;">✅ Found ' + data.sessions.length + ' documents!</p>';
                } else {
                    output.innerHTML += '<p style="color: orange;">⚠️ No documents uploaded yet. Go to Dashboard and upload a PDF.</p>';
                }
            })
            .catch(err => {
                output.innerHTML += '<p style="color: red;">❌ Error: ' + err.message + '</p>';
            });
        }
    </script>
</body>
</html>
